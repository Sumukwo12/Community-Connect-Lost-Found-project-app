name: mobileapp
description: Community Connect - Lost & Found Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0

  # Secure storage for auth token
  flutter_secure_storage: ^9.2.2

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # State management
  provider: ^6.1.2

  # Date/time formatting
  intl: ^0.19.0

  # Connectivity check
  connectivity_plus: ^6.1.0

  # UI extras
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  lottie: ^3.1.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/animations/
